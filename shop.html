      * {

      html,
      body {
         width: 100%;
         height: 100%;

      }

      #main {
         width: 100%;

      <!-- input {

      .card {
         padding: 20px;
         max-width: 300px;
         border: 2px solid rgb(99, 99, 99);
         display: inline-block;
         margin-top: 40px;
         border-radius: 5px solid orange;
         background-color: rgb(213, 216, 216);
         color: #fff;
      }

      .card p {
         font-size: 12px;
         margin-top: 30px;
      }

      .card h5 {
         margin-top: 10px;
      }

      .profile {
         width: 50px;
         height: 50px;
         background-color: red;
         border-radius: 50%;
         margin-bottom: 20px;
         overflow: hidden;
      }

      .profile img {
         height: 50px;
         width: 50px;
         object-fit: cover;
         border-radius: 50%;

      }

      #abcd {
         height: 200px;
         width: 200px;
         background-color: red;
         position: absolute;
      }
   </style>


</head>
